<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Research illustration placeholder">
  <defs>
    <linearGradient id="r-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1a2d42"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" fill="url(#r-bg)" rx="14"/>
  <!-- Nodes (SNN visual metaphor) -->
  <!-- Layer 1 -->
  <circle cx="100" cy="100" r="14" fill="#4a90c4" opacity="0.9"/>
  <circle cx="100" cy="160" r="14" fill="#4a90c4" opacity="0.7"/>
  <circle cx="100" cy="220" r="14" fill="#4a90c4" opacity="0.5"/>
  <!-- Layer 2 -->
  <circle cx="240" cy="80"  r="14" fill="#2e6da4" opacity="0.9"/>
  <circle cx="240" cy="140" r="14" fill="#2e6da4" opacity="0.8"/>
  <circle cx="240" cy="200" r="14" fill="#2e6da4" opacity="0.7"/>
  <circle cx="240" cy="260" r="14" fill="#2e6da4" opacity="0.5"/>
  <!-- Layer 3 -->
  <circle cx="380" cy="110" r="14" fill="#2a8a8a" opacity="0.9"/>
  <circle cx="380" cy="180" r="14" fill="#2a8a8a" opacity="0.75"/>
  <circle cx="380" cy="250" r="14" fill="#2a8a8a" opacity="0.55"/>
  <!-- Layer 4 (output) -->
  <circle cx="500" cy="140" r="16" fill="#ffffff" opacity="0.85"/>
  <circle cx="500" cy="200" r="16" fill="#ffffff" opacity="0.6"/>
  <!-- Connections layer 1→2 -->
  <line x1="114" y1="100" x2="226" y2="80"  stroke="#4a90c4" stroke-width="1.2" opacity="0.35"/>
  <line x1="114" y1="100" x2="226" y2="140" stroke="#4a90c4" stroke-width="1.2" opacity="0.3"/>
  <line x1="114" y1="160" x2="226" y2="80"  stroke="#4a90c4" stroke-width="1.2" opacity="0.2"/>
  <line x1="114" y1="160" x2="226" y2="140" stroke="#4a90c4" stroke-width="1.2" opacity="0.4"/>
  <line x1="114" y1="160" x2="226" y2="200" stroke="#4a90c4" stroke-width="1.2" opacity="0.3"/>
  <line x1="114" y1="220" x2="226" y2="200" stroke="#4a90c4" stroke-width="1.2" opacity="0.3"/>
  <line x1="114" y1="220" x2="226" y2="260" stroke="#4a90c4" stroke-width="1.2" opacity="0.25"/>
  <!-- Connections layer 2→3 -->
  <line x1="254" y1="80"  x2="366" y2="110" stroke="#2e6da4" stroke-width="1.2" opacity="0.35"/>
  <line x1="254" y1="140" x2="366" y2="110" stroke="#2e6da4" stroke-width="1.2" opacity="0.3"/>
  <line x1="254" y1="140" x2="366" y2="180" stroke="#2e6da4" stroke-width="1.2" opacity="0.4"/>
  <line x1="254" y1="200" x2="366" y2="180" stroke="#2e6da4" stroke-width="1.2" opacity="0.35"/>
  <line x1="254" y1="200" x2="366" y2="250" stroke="#2e6da4" stroke-width="1.2" opacity="0.25"/>
  <line x1="254" y1="260" x2="366" y2="250" stroke="#2e6da4" stroke-width="1.2" opacity="0.3"/>
  <!-- Connections layer 3→4 -->
  <line x1="394" y1="110" x2="484" y2="140" stroke="#2a8a8a" stroke-width="1.5" opacity="0.5"/>
  <line x1="394" y1="180" x2="484" y2="140" stroke="#2a8a8a" stroke-width="1.5" opacity="0.45"/>
  <line x1="394" y1="180" x2="484" y2="200" stroke="#2a8a8a" stroke-width="1.5" opacity="0.5"/>
  <line x1="394" y1="250" x2="484" y2="200" stroke="#2a8a8a" stroke-width="1.5" opacity="0.35"/>
  <!-- Spike pulses (visual accent) -->
  <circle cx="170" cy="140" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="310" cy="200" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="440" cy="150" r="4" fill="#ffffff" opacity="0.9"/>
  <!-- Label -->
  <text x="300" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Spiking Neural Network — Research Illustration</text>
</svg>
