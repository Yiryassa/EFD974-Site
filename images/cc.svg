<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 420" role="img" aria-label="Profile photo placeholder">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6e8f5"/>
      <stop offset="100%" stop-color="#b8d4ea"/>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="170" cy="160" r="88"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="340" height="420" fill="url(#bg-grad)" rx="14"/>
  <!-- Subtle pattern -->
  <circle cx="280" cy="50" r="90" fill="#2e6da4" opacity="0.07"/>
  <circle cx="60" cy="370" r="70" fill="#2e6da4" opacity="0.05"/>
  <!-- Body / shoulders -->
  <ellipse cx="170" cy="340" rx="120" ry="80" fill="#2e6da4" opacity="0.2"/>
  <!-- Head circle -->
  <circle cx="170" cy="160" r="88" fill="#2e6da4" opacity="0.25"/>
  <!-- Face icon -->
  <circle cx="170" cy="148" r="44" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="170" cy="240" rx="60" ry="38" fill="#ffffff" opacity="0.4"/>
  <!-- Label -->
  <rect x="90" y="368" width="160" height="28" rx="14" fill="white" opacity="0.5"/>
  <text x="170" y="387" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0d1b2a" opacity="0.7">[YOUR PHOTO]</text>
</svg>
